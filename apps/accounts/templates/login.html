{% extends "base.html" %}

{% block title %}Login - EPIN NETWORK{% endblock %}

{% block content %}
<!-- Full Page Container matching Home Page background -->
<div class="bg-[#f3f6fb] font-sans text-slate-800 min-h-[calc(100vh-80px)] py-12 lg:py-20 flex items-center justify-center">
    <div class="max-w-md w-full mx-auto px-4">
        
        <!-- Login Card Container -->
        <div class="bg-white p-8 sm:p-10 rounded-[28px] border border-slate-100 shadow-xl">
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <!-- E-Logo Badge -->
                <div class="w-12 h-12 bg-blue-600 rounded-xl mx-auto flex items-center justify-center text-white font-black text-2xl shadow-md shadow-blue-600/20 mb-4">
                    E
                </div>
                <span class="text-[11px] font-extrabold tracking-wider text-emerald-600 uppercase">
                    MEMBER PORTAL
                </span>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight mt-1">
                    Welcome Back
                </h2>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed">
                    Sign in to access your network dashboard, tree view & daily earnings.
                </p>
            </div>

            <!-- Login Form -->
            <form action="#" method="POST" class="space-y-5">
                
                <!-- Member ID / Email Field -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-800 uppercase tracking-wider mb-2">
                        User ID / Email Address
                    </label>
                    <input type="text" 
                           placeholder="e.g. EP123456 or user@email.com" 
                           required 
                           class="w-full text-xs sm:text-sm px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all text-slate-800 font-medium placeholder-slate-400" />
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-[11px] font-bold text-slate-800 uppercase tracking-wider">
                            Password
                        </label>
                        <a href="#" class="text-[11px] font-bold text-blue-600 hover:underline">
                            Forgot Password?
                        </a>
                    </div>
                    <input type="password" 
                           placeholder="••••••••" 
                           required 
                           class="w-full text-xs sm:text-sm px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50/50 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all text-slate-800 font-medium placeholder-slate-400" />
                </div>

                <!-- Remember Me Checkbox -->
                <div class="flex items-center pt-1">
                    <input id="remember-me" 
                           type="checkbox" 
                           class="h-4 w-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                    <label for="remember-me" class="ml-2 block text-xs font-medium text-slate-600">
                        Keep me signed in on this device
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-bold text-xs sm:text-sm hover:bg-blue-700 transition-colors shadow-md shadow-blue-600/20">
                    Sign In To Portal
                </button>
            </form>

            <!-- Bottom Register Link -->
            <div class="mt-8 text-center pt-6 border-t border-slate-100">
                <p class="text-xs text-slate-500 font-medium">
                    Don't have an account yet? 
                    <a href="{% url 'register' %}" class="font-bold text-blue-600 hover:underline ml-1">
                        Register Now
                    </a>
                </p>
            </div>

        </div>

    </div>
</div>
{% endblock %}
