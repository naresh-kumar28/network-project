{% extends "panel/layout/base.html" %}
{% load static %}

{% block title %}System Settings{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">System Parameters & Configuration</h1>
        <p class="text-xs font-medium text-slate-500 mt-0.5">Configure MLM plan rules, currency, capping, and site parameters</p>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs space-y-4">
        <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">MLM Binary Rules</h3>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Binary Ratio</label>
            <input type="text" value="1 : 1" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Default Pair Commission Amount (₹)</label>
            <input type="number" value="300" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">TDS Tax Deduction (%)</label>
            <input type="number" value="5" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Charge Deduction (%)</label>
            <input type="number" value="5" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <button class="bg-[#6D4AFF] text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-xs">Save Binary Rules</button>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs space-y-4">
        <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Site Parameters</h3>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Platform Name</label>
            <input type="text" value="NETWORK PRO" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Currency Symbol</label>
            <input type="text" value="₹" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Maintenance Mode</label>
            <select class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
                <option selected>Disabled (Live)</option>
                <option>Enabled (Under Maintenance)</option>
            </select>
        </div>
        <button class="bg-[#6D4AFF] text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-xs">Save System Parameters</button>
    </div>
</div>
{% endblock %}
