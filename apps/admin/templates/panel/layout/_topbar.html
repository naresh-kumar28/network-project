{% load static %}
<header class="h-16 bg-white border-b border-slate-200/80 sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6 lg:px-8 shadow-xs">
    <!-- Left: Mobile Menu Toggle & Title / Breadcrumbs -->
    <div class="flex items-center space-x-3 sm:space-x-4">
        <!-- Mobile Sidebar Toggle -->
        <button id="sidebar-toggle" onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 focus:outline-none" aria-label="Toggle Sidebar">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <!-- Breadcrumb & Title Container -->
        <div>
            {% block topbar_title %}
            <div class="flex items-center space-x-2 text-xs text-slate-400 font-medium hidden sm:flex">
                <a href="{% url 'admin_dashboard' %}" class="hover:text-slate-600">Dashboard</a>
                {% if active_page != 'dashboard' %}
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-300"></i>
                <span class="text-slate-600 capitalize">{{ active_page|title }}</span>
                {% endif %}
            </div>
            {% endblock %}
        </div>
    </div>

    <!-- Right: Actions & User Avatar -->
    <div class="flex items-center space-x-3 sm:space-x-5">
        <!-- Notification Bell -->
        <div class="relative">
            <button class="relative p-2 rounded-xl text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition focus:outline-none" title="Notifications">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span class="absolute top-1.5 right-1.5 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white shadow-xs">
                    5
                </span>
            </button>
        </div>

        <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>

        <!-- Admin Profile Dropdown -->
        <div class="flex items-center space-x-3 cursor-pointer group">
            <div class="w-9 h-9 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-sm shadow-sm ring-2 ring-amber-500/20">
                <i data-lucide="user" class="w-5 h-5 text-slate-900"></i>
            </div>
            <div class="hidden sm:block text-left">
                <h4 class="text-xs font-bold text-slate-800 leading-tight group-hover:text-[#6D4AFF] transition">Admin</h4>
                <p class="text-[11px] text-slate-400 font-medium">Super Admin</p>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 transition"></i>
        </div>
    </div>
</header>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            sidebar.classList.toggle('-translate-x-full');
        }
    }
</script>
