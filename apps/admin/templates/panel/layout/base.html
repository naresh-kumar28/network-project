{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} | NETWORK PRO Admin Panel</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dark sidebar & smooth scroll */
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#F5F6FA] text-slate-800 antialiased min-h-screen flex flex-col">

    <div class="flex min-h-screen overflow-x-hidden">
        <!-- Sidebar Navigation -->
        {% include "panel/layout/_sidebar.html" %}

        <!-- Main Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 lg:pl-64 transition-all duration-300">
            <!-- Topbar Header -->
            {% include "panel/layout/_topbar.html" %}

            <!-- Main Page Content -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Global Modal Helpers & Lucide Initialization -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Global Modal Functions
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
