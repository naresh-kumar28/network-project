{% extends "panel/layout/base.html" %}
{% load static %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">Admin Settings & Configuration</h1>
        <p class="text-xs font-medium text-slate-500 mt-0.5">Manage admin credentials, security, and preferences</p>
    </div>
</div>

<div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-xs max-w-2xl space-y-4">
    <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Admin Account Security</h3>
    <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Admin Username</label>
        <input type="text" value="admin" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5" readonly>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Current Password</label>
        <input type="password" placeholder="••••••••" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
        <input type="password" placeholder="Enter new strong password" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl p-2.5">
    </div>
    <button class="bg-[#6D4AFF] text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-xs">Update Security Settings</button>
</div>
{% endblock %}
